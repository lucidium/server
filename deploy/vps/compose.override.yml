services:
  music-assistant:
    image: ma-server:${MA_IMAGE_TAG:-local}
    pull_policy: never
    volumes:
      - /opt/ma/widevine_cdm:/usr/local/bin/widevine_cdm:ro
    environment:
      MA_PULL_PUBLIC_BASE_URL: ${MA_PULL_PUBLIC_BASE_URL:-https://music.liandry.org/streamserver/pull}
    build:
      context: ${MA_SERVER_SOURCE_DIR:-/opt/ma/server}
      dockerfile: Dockerfile
      args:
        MASS_VERSION: "0.0.0"
        BUILD_COMMIT: ${MA_BUILD_COMMIT:-unknown}
        BASE_IMAGE_VERSION: ${MA_BASE_IMAGE_VERSION:-latest}
  sing-box:
    ports: !override
      - "80:80"
      - "443:443"
      - "127.0.0.1:8095:8095"
      - "127.0.0.1:8097:8097"
      - "127.0.0.1:9090:9090"
