services:
  music-assistant:
    image: ma-server:${MA_IMAGE_TAG:-local}
    pull_policy: never
    env_file:
      - path: /opt/ma/secrets/deezer.env
        required: false
    volumes:
      - /opt/ma/widevine_cdm:/usr/local/bin/widevine_cdm:ro
    environment:
      MA_PULL_PUBLIC_BASE_URL: ${MA_PULL_PUBLIC_BASE_URL:-https://music.liandry.org/streamserver/pull}
      MASS_APP_VAR_THEAUDIODB_API_KEY: "123"
    build:
      context: ${MA_SERVER_SOURCE_DIR:-/opt/ma/server}
      dockerfile: Dockerfile
      args:
        MASS_VERSION: "0.0.0"
        BUILD_COMMIT: ${MA_BUILD_COMMIT:-unknown}
        BASE_IMAGE_VERSION: ${MA_BASE_IMAGE_VERSION:-latest}
  sing-box:
    # Docker forwards external lookups inside this shared network namespace.
    # The loopback listener must be configured in sing-box first; see README.md.
    dns: !override
      - "127.0.0.1"
    healthcheck:
      test: ["CMD-SHELL", "nslookup -type=A example.com 127.0.0.1 >/dev/null 2>&1"]
    ports: !override
      - "80:80"
      - "443:443"
      - "127.0.0.1:8095:8095"
      - "127.0.0.1:8097:8097"
